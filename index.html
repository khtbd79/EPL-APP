<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#dc2626" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EPL 2026" />
    <title>EPL Pro Match Center</title>
    <meta name="description" content="EPL Pro Match Center - Odds &amp; percentage calculator, live match select, and analytics" />
    <meta property="og:title" content="EPL Pro Match Center" />
    <meta property="og:description" content="EPL Pro Match Center - Odds &amp; percentage calculator, live match select, and analytics" />

    <!-- PWA Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />

    <!-- Universal Bulletproof Font System & Android WebView Fallbacks -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      :root {
        --font-sans: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'Roboto Mono', Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      }
      *, *::before, *::after {
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html, body {
        font-family: var(--font-sans);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #ffffff;
        color: #0f172a;
        -webkit-tap-highlight-color: transparent;
        text-rendering: optimizeLegibility;
        text-size-adjust: 100%;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior-y: contain;
      }
      /* Ensure monospace and numeric elements never break in Android WebView */
      .font-mono, code, pre, kbd, samp {
        font-family: var(--font-mono) !important;
        font-variant-numeric: tabular-nums lining-nums;
      }
      /* Prevent unwanted zoom and layout shifting */
      input, select, textarea, button {
        font-family: inherit;
        text-size-adjust: 100%;
        -webkit-text-size-adjust: 100%;
      }
    </style>
  </head>
  <body class="antialiased selection:bg-red-600 selection:text-white bg-white text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
