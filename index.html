<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#dc2626" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EPL 2026" />
    <title>EPL Pro Match Center</title>
    <meta name="description" content="EPL Pro Match Center - Odds &amp; percentage calculator, live match select, and analytics" />
    <meta property="og:title" content="EPL Pro Match Center" />
    <meta property="og:description" content="EPL Pro Match Center - Odds &amp; percentage calculator, live match select, and analytics" />

    <!-- 100% Offline Standalone Icons & Assets (Zero External Network Requests) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23dc2626'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E" />

    <style>
      :root {
        --font-sans: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'Roboto Mono', Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      }
      *, *::before, *::after {
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html, body {
        font-family: var(--font-sans);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #ffffff;
        color: #0f172a;
        -webkit-tap-highlight-color: transparent;
        text-rendering: optimizeLegibility;
        text-size-adjust: 100%;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior-y: contain;
      }
      /* Ensure monospace and numeric elements never break in Android WebView */
      .font-mono, code, pre, kbd, samp {
        font-family: var(--font-mono) !important;
        font-variant-numeric: tabular-nums lining-nums;
      }
      /* Prevent unwanted zoom and layout shifting */
      input, select, textarea, button {
        font-family: inherit;
        text-size-adjust: 100%;
        -webkit-text-size-adjust: 100%;
      }
    </style>
  </head>
  <body class="antialiased selection:bg-red-600 selection:text-white bg-white text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
